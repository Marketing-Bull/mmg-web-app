name: Check Eventbrite for new MMG events

# Replaces the daily "Check Eventbrite for new MMG event" Claude routine.
#
# A plain Node step looks for upcoming events on the organizer page that are not
# in data/events.json. Most days there are none and the job ends there, free.
# When something is new, scripts/eventbrite-add-events.mjs adds it: the record,
# flyer conversion and static card are done in code, and Claude Haiku (the
# cheapest current model) writes only the short summary and checks the flyer.
# scripts/validate.mjs, the tests and the draft PR review catch mistakes.
#
# Claude is called directly with workload identity federation (GitHub OIDC
# token -> short-lived Anthropic token; repository variables ANTHROPIC_*), not
# through claude-code-action, because of anthropics/claude-code-action#1888.

on:
  schedule:
    - cron: "45 13 * * *" # 13:45 UTC = 8:45 AM EST / 9:45 AM EDT
  workflow_dispatch:
    inputs:
      probe:
        description: "Only test the Claude sign-in and one request (changes nothing)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: eventbrite-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Probe the Claude sign-in
        if: inputs.probe
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-oidc.jwt
        run: |
          curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          node scripts/eventbrite-add-events.mjs --probe

      - name: Look for new events
        id: scan
        if: ${{ !inputs.probe }}
        run: node scripts/eventbrite-new-events.mjs new-events.json

      # A draft PR from an earlier run may still be open and unmerged. Do not
      # open a second one for the same events.
      - name: Skip if a PR for these events already exists
        id: dedupe
        if: ${{ !inputs.probe && steps.scan.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: eventbrite/${{ steps.scan.outputs.ids }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare branch and tools
        if: ${{ !inputs.probe && steps.scan.outputs.count != '0' && steps.dedupe.outputs.skip == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "eventbrite/${{ steps.scan.outputs.ids }}"
          npm ci
          pip install --quiet pillow

      - name: Add the new events
        if: ${{ !inputs.probe && steps.scan.outputs.count != '0' && steps.dedupe.outputs.skip == 'false' }}
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-oidc.jwt
        run: |
          # Fresh GitHub OIDC token, exchanged by the script for a short-lived Anthropic token.
          curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          node scripts/eventbrite-add-events.mjs new-events.json
          node scripts/sync-static-events.mjs
          git add data/events.json index.html assets/events/upcoming
          git commit -m "Add upcoming Eventbrite event(s)"

      - name: Push and open draft PR
        if: ${{ !inputs.probe && steps.scan.outputs.count != '0' && steps.dedupe.outputs.skip == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: eventbrite/${{ steps.scan.outputs.ids }}
        run: |
          if [ -z "$(git log origin/${{ github.event.repository.default_branch }}..HEAD --oneline)" ]; then
            echo "::error::The add-events step made no commit."
            exit 1
          fi
          # Fail here, not in review, if anything is off.
          node scripts/sync-static-events.mjs --check
          node scripts/validate.mjs
          npm test
          git push -u origin "$BRANCH"
          {
            echo "Found by the daily Eventbrite check (\`.github/workflows/eventbrite-check.yml\`)."
            echo
            echo "**After merging, open the content manager and click Publish Events.** The live site serves the Vercel Blob copy first, so this commit will not appear until that is done."
            echo
            echo "Please check the summary text and flyer before merging."
            if [ -f PR_NOTES.md ]; then echo; cat PR_NOTES.md; fi
          } > pr-body.md
          gh pr create --draft --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
            --title "Add upcoming Eventbrite event(s)" --body-file pr-body.md
